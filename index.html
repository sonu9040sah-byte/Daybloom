<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5f7cff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Daybloom — Daily Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="titlebox">
      <h1 id="title"></h1>
      <span id="subtitle"></span>
    </div>
    <div class="nav-btns">
      <button class="pill" id="todayBtn" data-act="today">Today</button>
      <button class="icon" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
  </header>
  <div id="progress"><i></i></div>
  <div id="weekStrip"></div>
  <div id="view"></div>

  <nav id="tabbar">
    <button data-act="view" data-v="day"><span>🗓️</span>Day</button>
    <button data-act="view" data-v="month"><span>📅</span>Calendar</button>
    <button data-act="view" data-v="insights"><span>📊</span>Insights</button>
    <button data-act="menu"><span>📥</span>Inbox</button>
  </nav>
  <button id="fab" data-act="add" aria-label="Add task">+</button>
</div>

<div id="modal" class="overlay" hidden><div class="card" id="modalCard"></div></div>
<div id="drawer" class="overlay" hidden><div class="card" id="drawerCard"></div></div>

<div id="focus" class="overlay" hidden>
  <div class="card focus-card">
    <div class="grab"></div>
    <div id="fTitle" class="ftitle"></div>
    <div class="fring" id="fRing"><div id="fTime" class="ftime">25:00</div></div>
    <div class="fpresets">
      <button data-f="15">15</button><button data-f="25" class="on">25</button>
      <button data-f="45">45</button><button data-f="50">50</button>
    </div>
    <div class="factions">
      <button id="fStart" class="primary">Start</button>
      <button id="fReset">Reset</button>
      <button id="fClose">Close</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json,text/plain" hidden>
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
